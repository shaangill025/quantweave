openapi: 3.1.0
info:
  title: Portfolio Intelligence application contract
  version: 0.1.0-design
  description: Designed API; no implementation. Tenant is server-derived. No live
    broker mutation endpoint. Feature rights and runtime approvals apply.
servers:
- url: /api/v1
security:
- sessionCookie: []
paths:
  /health:
    get:
      operationId: readHealth
      summary: Read component health
      description: All access and state transitions require server-side scope, permission,
        version and eligibility checks.
      parameters: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Typed validation, authorization, conflict, capacity or dependency
            failure; never a synthetic success.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /capabilities:
    get:
      operationId: readCapabilities
      summary: Read qualified and unavailable capabilities
      description: All access and state transitions require server-side scope, permission,
        version and eligibility checks.
      parameters: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        default:
          description: Typed validation, authorization, conflict, capacity or dependency
            failure; never a synthetic success.
          content:
            application/problem+json:
