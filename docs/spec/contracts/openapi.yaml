      description: All access and state transitions require server-side scope, permission,
        version and eligibility checks.
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
        description: Server-bounded page size; tenant derived from session.
