components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pi_session
      description: HttpOnly Secure SameSite session; state-changing operations also
        require origin/CSRF validation.
  schemas:
    CreateAccount:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        broker:
          type: string
        account_type:
          type: string
        reporting_currency:
          type: string
          pattern: ^[A-Z]{3}$
        analysis_scope:
          type: string
          enum:
          - complete_declared
          - partial_declared
          - hypothetical
      required:
      - name
      - broker
      - account_type
      - reporting_currency
      - analysis_scope
      additionalProperties: false
    RevisionAction:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 1
        acknowledgement:
          type: string
          minLength: 1
        reason:
          type: string
      required:
      - expected_revision
      - acknowledgement
      - reason
      additionalProperties: false
    MapImport:
      type: object
      properties:
        classification:
          type: string
          enum:
          - new_account
          - existing_account_view
          - watchlist
          - hypothetical
        target_account_id:
          type:
          - string
          - 'null'
        column_mapping:
          type: array
          items:
            type: object
            properties:
              source_column:
                type: string
              canonical_field:
                type: string
            required:
            - source_column
            - canonical_field
            additionalProperties: false
        source_timezone:
          type: string
        currency_policy:
          type: string
      required:
      - classification
      - target_account_id
      - column_mapping
      - source_timezone
      - currency_policy
      additionalProperties: false
    CommitImport:
      type: object
      properties:
        preview_id: *id001
        commit_token:
          type: string
        expected_account_revision:
          type: integer
          minimum: 0
      required:
      - preview_id
      - commit_token
      - expected_account_revision
      additionalProperties: false
    CreateWatchlist:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
      - name
      - description
      additionalProperties: false
    WatchlistEntry:
      type: object
      properties:
        instrument_id: *id001
        thesis:
          type: string
        tags:
          type: array
          items:
            type: string
        monitoring_priority:
          type: integer
          minimum: 0
          maximum: 100
        conditions:
          type: array
          items:
            $ref: ./schemas/common.schema.json#/$defs/Condition
        invalidation_text:
          type: string
      required:
      - instrument_id
      - thesis
      - tags
      - monitoring_priority
      - conditions
      - invalidation_text
      additionalProperties: false
    PolicyDraft:
      type: object
      properties:
        scope_account_ids:
          type: array
          items: *id001
          minItems: 1
        goal:
          type: string
        horizons:
          type: array
          items:
            type: string
            enum:
            - long_term
            - swing_position
            - intraday
        answers:
          type: array
          items:
            type: object
            properties:
              question_id: *id001
              values:
                type: array
                items:
                  type: string
            required:
            - question_id
            - values
            additionalProperties: false
      required:
      - scope_account_ids
      - goal
      - horizons
      - answers
      additionalProperties: false
    AdoptVersion:
      type: object
      properties:
        version_id: *id001
        content_hash: &id002
          type: string
          pattern: ^[a-f0-9]{64}$
        expected_revision:
          type: integer
          minimum: 1
        acknowledgement:
          type: string
          minLength: 1
      required:
      - version_id
      - content_hash
      - expected_revision
      - acknowledgement
      additionalProperties: false
    CreateConnection:
      type: object
      properties:
        provider:
          type: string
        purpose:
          type: string
          enum:
          - read_only_account
          - market_data
          - model_api
          - model_native_runtime
        deployment_profile_id: *id001
        permission_profile_id: *id001
      required:
      - provider
      - purpose
      - deployment_profile_id
      - permission_profile_id
      additionalProperties: false
    ConnectionAuth:
      type: object
      properties:
        connection_id: *id001
        auth_method:
          type: string
          enum:
          - official_redirect
          - secret_vault_form
          - native_runtime
        return_path:
          type: string
          pattern: ^/
      required:
      - connection_id
      - auth_method
      - return_path
      additionalProperties: false
    RunExperiment:
      type: object
      properties:
        target:
          type: string
          enum:
          - personal_adaptation
          - research
          - strategy
          - evaluator
          - application_code
          - recursive_optimizer
        protocol_id: *id001
        baseline_version_id: *id001
        scope_id: *id001
        budget_cap_usd: &id003
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          maxLength: 60
        sandbox_profile_id: *id001
      required:
      - target
      - protocol_id
      - baseline_version_id
      - scope_id
      - budget_cap_usd
      - sandbox_profile_id
      additionalProperties: false
    PromoteCandidate:
      type: object
      properties:
        candidate_id: *id001
        candidate_hash: *id002
        assessment_receipt_ids:
          type: array
          items: *id001
          minItems: 1
        rollback_version_id: *id001
        reauthentication_receipt_id: *id001
        acknowledgement:
          type: string
          minLength: 1
      required:
      - candidate_id
      - candidate_hash
      - assessment_receipt_ids
      - rollback_version_id
      - reauthentication_receipt_id
      - acknowledgement
      additionalProperties: false
    CreateSimulation:
      type: object
      properties:
        name:
          type: string
        base_currency:
          type: string
          pattern: ^[A-Z]{3}$
        starting_cash: *id003
        execution_model_id: *id001
        benchmark_policy_id: *id001
        mode:
          type: string
          enum:
          - manual
          - approved_policy_shadow
      required:
      - name
      - base_currency
      - starting_cash
      - execution_model_id
      - benchmark_policy_id
      - mode
      additionalProperties: false
    ExportRequest:
      type: object
      properties:
        scope_account_ids:
          type: array
          items: *id001
        include_private_learning: &id004
          type: boolean
        include_permitted_evidence: *id004
        reauthentication_receipt_id: *id001
      required:
      - scope_account_ids
      - include_private_learning
      - include_permitted_evidence
      - reauthentication_receipt_id
      additionalProperties: false
    DeleteRequest:
      type: object
      properties:
        scope_id: *id001
        classes:
          type: array
          items:
            type: string
        reauthentication_receipt_id: *id001
        acknowledgement:
          type: string
          minLength: 1
      required:
      - scope_id
      - classes
      - reauthentication_receipt_id
      - acknowledgement
      additionalProperties: false
    NotificationPreferences:
      type: object
      properties:
        in_app: *id004
        email: *id004
        browser_push: *id004
        quiet_hours_timezone:
          type: string
        quiet_hours:
          type: array
          items:
            type: string
        redact_financial_values: *id004
      required:
      - in_app
      - email
      - browser_push
      - quiet_hours_timezone
      - quiet_hours
      - redact_financial_values
      additionalProperties: false
    ProposalSelection:
      type: object
      properties:
        proposal_version_ids:
          type: array
          items: *id001
          minItems: 1
        expected_account_revision:
          type: integer
          minimum: 1
        mode:
          type: string
          enum:
          - planned
          - dismissed
      required:
      - proposal_version_ids
      - expected_account_revision
      - mode
      additionalProperties: false
    Feedback:
      type: object
      properties:
        object_id: *id001
        category:
          type: string
          enum:
          - incorrect_fact
          - irrelevant
          - clear
          - unclear
          - missed_risk
          - other
        message:
          type: string
          maxLength: 4000
        cross_user_contribution_consent:
          const: false
      required:
      - object_id
      - category
      - message
      - cross_user_contribution_consent
      additionalProperties: false
    Page:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
          - unavailable
        component:
          type: string
        checked_at: &id005
          type: string
          format: date-time
      required:
      - status
      - component
      - checked_at
      additionalProperties: false
    Capabilities:
      type: object
      properties:
        deployment:
          type: string
          enum:
          - hosted
          - self_hosted
        features:
          type: array
          items:
            type: object
            properties:
              id: *id001
              enabled: *id004
              reason_codes:
                type: array
                items: *id001
            required:
            - id
            - enabled
            - reason_codes
            additionalProperties: false
      required:
      - deployment
      - features
      additionalProperties: false
    Connection:
      type: object
      properties:
        id: *id001
        provider:
          type: string
        purpose:
          type: string
        status:
          type: string
          enum:
          - unconfigured
          - awaiting_auth
          - connected
          - expired
          - degraded
          - revoked
        permissions:
          type: array
          items:
            type: string
        last_success_at:
          type:
