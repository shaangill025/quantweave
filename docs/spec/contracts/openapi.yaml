          minLength: 1
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Expected resource revision/ETag; stale values return 409.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account'
        default:
