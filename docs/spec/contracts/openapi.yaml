      description: All access and state transitions require server-side scope, permission,
        version and eligibility checks.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account'
        default:
          description: Typed validation, authorization, conflict, capacity or dependency
            failure; never a synthetic success.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccount'
  /accounts/{account_id}:
    get:
      operationId: readAccount
      summary: Read account metadata
      description: All access and state transitions require server-side scope, permission,
        version and eligibility checks.
      parameters:
      - name: account_id
        in: path
        required: true
        schema: &id001
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
