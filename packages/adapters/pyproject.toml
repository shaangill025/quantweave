[project]
name = "qw-adapters"
version = "0.1.0"
description = "Portfolio Intelligence adapters: PostgreSQL (psycopg 3) migration runner and repositories"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg==3.3.6",
    "qw-domain",
]

[project.scripts]
qw-db-init = "qw_adapters.db_init_cli:main"
qw-migrate = "qw_adapters.migrate_cli:main"

[tool.uv.sources]
qw-domain = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"
