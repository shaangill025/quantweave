name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Throwaway PostgreSQL 16 for the @pytest.mark.db tests (CHK-DB-INTEGRATION).
    # Trust auth on the job-local service, so no credential exists. Digest pin open.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      UV_PYTHON: "3.13"
      UV_LOCKED: "1"
      QW_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      # A db test that cannot reach PostgreSQL fails instead of skipping.
      QW_REQUIRE_DB: "1"
    steps:
      # Third-party actions pinned by commit SHA (tag -> SHA read with git ls-remote).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: libpq for psycopg (pure-Python build, system libpq)
        run: |
          dpkg -s libpq5 >/dev/null 2>&1 || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5
          }
          uv run python -c "import psycopg; print('libpq', psycopg.pq.version())"
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - run: uv run mypy --strict
      - run: uv run pytest
      - run: uv run python tools/check_no_float.py
      - name: Spec and contract checks
        run: |
          uv run python tools/check_spec_artifacts.py
          uv run python tools/check_spec_artifacts.py --self-test
          uv run python tools/check_contracts.py
          uv run python tools/check_contracts.py --self-test
      - name: Spec validator on a copy (it rewrites its reports)
        run: |
          cp -r docs/spec "$RUNNER_TEMP/spec"
          uv run python "$RUNNER_TEMP/spec/tools/validate_spec.py"
          git diff --exit-code docs/spec
