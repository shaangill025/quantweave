name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keeps a copy of the PostgreSQL 16 test image in this repository's own GitHub
  # registry, so the database tests do not depend on anonymous pull limits:
  # Docker Hub's limit forced #53 onto the ECR Public mirror, whose data limit then
  # blocked CI before any test ran. When the copy is absent it is created from Docker
  # Hub (ECR Public as fallback), labelled with this repo as its source so the
  # package links to this repo (confirm once in its settings); this workflow never
  # overwrites it. The python job's service is pinned by the digest this job printed
  # on its first run (owner decision 2026-10-15), so a replaced tag can no longer
  # change what the tests run against; the tag is kept for this existence check,
  # and repinning is a reviewed edit of the service image. Only same-repo
  # runs create the copy; a fork PR gets a read-only token that cannot read this
  # private package, so fork PRs cannot run the database tests.
  postgres-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      MIRROR: ghcr.io/${{ github.repository }}/postgres:16
      SOURCE_URL: https://github.com/${{ github.repository }}
      ACTOR: ${{ github.actor }}
      SAME_REPO: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Mirror postgres:16 into GHCR when absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if ! docker buildx imagetools inspect "$MIRROR" >/dev/null 2>&1; then
            if [ "$SAME_REPO" != "true" ]; then
              echo "::error::$MIRROR is absent and a fork PR cannot create it"; exit 1
            fi
            note="index:org.opencontainers.image.source=$SOURCE_URL"
            docker buildx imagetools create --annotation "$note" -t "$MIRROR" docker.io/library/postgres:16 ||
              docker buildx imagetools create --annotation "$note" -t "$MIRROR" public.ecr.aws/docker/library/postgres:16
          fi
          echo "mirror digest: $(docker buildx imagetools inspect "$MIRROR" --format '{{.Manifest.Digest}}')"
          docker logout ghcr.io

  # Owner decision 13: the Python candidate rootfs is built in CI and pinned by digest.
  # Mirrors python:3.13-slim exactly as postgres-image mirrors postgres:16.
  python-base-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      MIRROR: ghcr.io/${{ github.repository }}/python:3.13-slim
      SOURCE_URL: https://github.com/${{ github.repository }}
      ACTOR: ${{ github.actor }}
      SAME_REPO: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Mirror python:3.13-slim into GHCR when absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if ! docker buildx imagetools inspect "$MIRROR" >/dev/null 2>&1; then
            if [ "$SAME_REPO" != "true" ]; then
              echo "::error::$MIRROR is absent and a fork PR cannot create it"; exit 1
            fi
            note="index:org.opencontainers.image.source=$SOURCE_URL"
            docker buildx imagetools create --annotation "$note" -t "$MIRROR" docker.io/library/python:3.13-slim ||
              docker buildx imagetools create --annotation "$note" -t "$MIRROR" public.ecr.aws/docker/library/python:3.13-slim
          fi
          echo "mirror digest: $(docker buildx imagetools inspect "$MIRROR" --format '{{.Manifest.Digest}}')"
          docker logout ghcr.io

  # Builds the candidate rootfs from the linux/amd64 manifest pinned in
  # tools/candidate_rootfs.json, twice; each tree is pruned, audited and digested, the
  # digests must agree and equal the pin. Fails while a pin is null (it prints them).
  candidate-rootfs:
    needs: python-base-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      REPO: ghcr.io/${{ github.repository }}/python
      MIRROR: ghcr.io/${{ github.repository }}/python:3.13-slim
      ACTOR: ${{ github.actor }}
      TOOL: tools/candidate_rootfs.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull the pinned base image manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          platform=$(python3 "$TOOL" show platform)
          digest=$(python3 "$TOOL" show base_manifest_digest)
          if [ -z "$digest" ]; then
            digest=$(docker buildx imagetools inspect "$MIRROR" --raw |
              python3 "$TOOL" platform-digest --platform "$platform")
            echo "::warning::base_manifest_digest is not pinned; $MIRROR resolves to $digest"
          fi
          docker pull --platform "$platform" "$REPO@$digest"
          docker logout ghcr.io
          echo "BASE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "PLATFORM=$platform" >> "$GITHUB_ENV"
      - name: Build, prune, audit and digest the rootfs twice
        run: |
          set -o pipefail
          for n in 1 2; do
            dir="$RUNNER_TEMP/rootfs-$n"
            mkdir -m 755 "$dir"  # the root's mode is part of the digest
            cid=$(docker create --platform "$PLATFORM" "$REPO@$BASE_DIGEST")
            docker export "$cid" | sudo tar -xpf - --numeric-owner -C "$dir"
            docker rm "$cid"
            sudo python3 "$TOOL" prune "$dir"
            sudo python3 "$TOOL" audit "$dir"
            sudo python3 "$TOOL" digest "$dir" > "$RUNNER_TEMP/digest-$n.json"
          done
          tree=$(jq -r .sha256_tree "$RUNNER_TEMP/digest-1.json")
          if [ "$tree" != "$(jq -r .sha256_tree "$RUNNER_TEMP/digest-2.json")" ]; then
            echo "::error::two exports of the same image gave different tree digests"; exit 1
          fi
          echo "TREE=$tree" >> "$GITHUB_ENV"
      - name: Check Python in the tree, then the pinned digests
        run: |
          set -o pipefail
          dir="$RUNNER_TEMP/rootfs-1"
          ver=$(sudo chroot --userspec=65534:65534 "$dir" /usr/local/bin/python3 -I -c \
            'import sys; print("%d.%d.%d" % sys.version_info[:3])')
          want=$(python3 "$TOOL" show python)
          {
            echo "### Python candidate rootfs"
            echo "- base: \`$REPO@$BASE_DIGEST\` ($PLATFORM)"
            echo "- python: $ver (pinned $want)"
            echo "- tree_sha256: \`$TREE\` ($(jq -r '.entries, .format' "$RUNNER_TEMP/digest-1.json" | paste -sd' '))"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$ver" in "$want".*) ;; *) echo "::error::python $ver is not $want"; exit 1 ;; esac
          pinned=$(python3 "$TOOL" show tree_sha256)
          if [ -z "$pinned" ] || [ -z "$(python3 "$TOOL" show base_manifest_digest)" ]; then
            echo "::error::not pinned: set base_manifest_digest to $BASE_DIGEST and tree_sha256 to $TREE in tools/candidate_rootfs.json (reviewed edit)"
            exit 1
          fi
          sudo python3 "$TOOL" digest "$dir" --expect "$pinned"

  python-tests:
    needs: postgres-image
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    # The suite took 30 minutes in one job on main (2026-10-24) and grows with each
    # store, so it runs as four disjoint shards (tools/pytest_shard.py: every test
    # file in exactly one shard); each shard has its own PostgreSQL service.
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    # Throwaway PostgreSQL 16 for the @pytest.mark.db tests (CHK-DB-INTEGRATION).
    # Trust auth on the job-local service, so the database has no credential. The
    # registry login uses this run's short-lived GITHUB_TOKEN (packages: read).
    services:
      postgres:
        image: ghcr.io/${{ github.repository }}/postgres@sha256:1efe4a7a46f0d15554100d14b6e9d455c74028fd64fd7173957f63be1f639c81
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      UV_PYTHON: "3.13"
      UV_LOCKED: "1"
      QW_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      # A db test that cannot reach PostgreSQL fails instead of skipping.
      QW_REQUIRE_DB: "1"
    steps:
      # Third-party actions pinned by commit SHA (tag -> SHA read with git ls-remote).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: libpq for psycopg (pure-Python build, system libpq)
        run: |
          dpkg -s libpq5 >/dev/null 2>&1 || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5
          }
          uv run python -c "import psycopg; print('libpq', psycopg.pq.version())"
      - name: Partition check
        run: python3 tools/pytest_shard.py --self-test
      - name: pytest (shard ${{ matrix.shard }} of 4)
        run: |
          python3 tools/pytest_shard.py ${{ matrix.shard }} 4 > "$RUNNER_TEMP/shard.txt"
          uv run pytest $(cat "$RUNNER_TEMP/shard.txt")

  python:
    # Static and spec checks; green only when every test shard passed (a skipped
    # or failed shard fails this job, so it cannot read as success).
    needs: python-tests
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.13"
      UV_LOCKED: "1"
    steps:
      - name: All test shards passed
        env:
          SHARDS: ${{ needs.python-tests.result }}
        run: test "$SHARDS" = success
      # Third-party actions pinned by commit SHA (tag -> SHA read with git ls-remote).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: libpq for psycopg (pure-Python build, system libpq)
        run: |
          dpkg -s libpq5 >/dev/null 2>&1 || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5
          }
          uv run python -c "import psycopg; print('libpq', psycopg.pq.version())"
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - run: uv run mypy --strict
      - run: uv run python tools/check_no_float.py
      - name: Spec and contract checks
        run: |
          uv run python tools/check_spec_artifacts.py
          uv run python tools/check_spec_artifacts.py --self-test
          uv run python tools/check_contracts.py
          uv run python tools/check_contracts.py --self-test
      - name: Spec validator on a copy (it rewrites its reports)
        run: |
          cp -r docs/spec "$RUNNER_TEMP/spec"
          uv run python "$RUNNER_TEMP/spec/tools/validate_spec.py"
          git diff --exit-code docs/spec
