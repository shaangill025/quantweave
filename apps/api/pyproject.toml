[project]
name = "qw-api"
version = "0.1.0"
description = "Portfolio Intelligence HTTP API (FastAPI composition root): sessions, CSRF, membership authorization, error envelope"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "starlette==1.6.0",
    "qw-adapters",
]

[project.scripts]
qw-bootstrap = "qw_api.bootstrap:main"

[tool.uv.sources]
qw-adapters = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"
