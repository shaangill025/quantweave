# Virtual uv workspace root: no package of its own. Members: packages/* and apps/api.
[tool.uv]
# Transitive pins held back to releases at least two weeks old (T010 review).
constraint-dependencies = ["pycparser<3.1"]

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "hypothesis==6.168.5",
    "jsonschema==4.26.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "rfc3339-validator==0.1.4",
    "ruff==0.16.10",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["docs/spec"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "UP", "TID", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing T001/T008 scripts each have one long docstring line; not rewritten here.
"tools/check_contracts.py" = ["E501"]
"tools/check_spec_artifacts.py" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "naive UTC; use datetime.now(UTC)"
"datetime.datetime.utcfromtimestamp".msg = "naive UTC; use datetime.fromtimestamp(ts, UTC)"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages", "apps/api", "tools", "tests"]
exclude = ["^docs/"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps/api", "tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config"]
pythonpath = ["packages/domain/tests"]  # shared SYNTHETIC test helpers (no conftest)
markers = [
    "db: needs PostgreSQL 16 (QW_TEST_DATABASE_URL or host binaries); QW_REQUIRE_DB=1 turns a skip into a failure",
]
